<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="420" fill="#f8f9fa" rx="12"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Semantic HTML — Page Layout</text>

  <!-- Browser chrome -->
  <rect x="80" y="50" width="560" height="340" rx="8" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
  <rect x="80" y="50" width="560" height="28" rx="8" fill="#e9ecef"/>
  <rect x="80" y="64" width="560" height="14" fill="#e9ecef"/>
  <circle cx="100" cy="64" r="6" fill="#ff5f57"/>
  <circle cx="120" cy="64" r="6" fill="#febc2e"/>
  <circle cx="140" cy="64" r="6" fill="#28c840"/>
  <rect x="200" y="57" width="300" height="14" rx="7" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="350" y="68" text-anchor="middle" font-size="10" fill="#aaa">mypage.html</text>

  <!-- header -->
  <rect x="90" y="88" width="540" height="44" rx="4" fill="#e34c26" opacity="0.15" stroke="#e34c26" stroke-width="1.5"/>
  <text x="110" y="105" font-size="11" fill="#e34c26" font-weight="bold">&lt;header&gt;</text>
  <text x="360" y="113" text-anchor="middle" font-size="12" fill="#e34c26">Site logo &amp; page title</text>

  <!-- nav -->
  <rect x="90" y="140" width="540" height="32" rx="4" fill="#f0b429" opacity="0.15" stroke="#f0b429" stroke-width="1.5"/>
  <text x="110" y="155" font-size="11" fill="#b07d00" font-weight="bold">&lt;nav&gt;</text>
  <text x="360" y="162" text-anchor="middle" font-size="12" fill="#b07d00">Home   |   About   |   Projects   |   Contact</text>

  <!-- main -->
  <rect x="90" y="180" width="380" height="160" rx="4" fill="#264de4" opacity="0.08" stroke="#264de4" stroke-width="1.5"/>
  <text x="110" y="197" font-size="11" fill="#264de4" font-weight="bold">&lt;main&gt;</text>

  <!-- article inside main -->
  <rect x="100" y="202" width="360" height="128" rx="4" fill="#264de4" opacity="0.08" stroke="#264de4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="116" y="218" font-size="10" fill="#264de4">&lt;article&gt;</text>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#264de4">Main content goes here</text>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#264de4">(blog post, CV, page body...)</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#264de4" opacity="0.6">&lt;/article&gt;</text>

  <!-- aside -->
  <rect x="480" y="180" width="150" height="160" rx="4" fill="#6f42c1" opacity="0.1" stroke="#6f42c1" stroke-width="1.5"/>
  <text x="496" y="197" font-size="11" fill="#6f42c1" font-weight="bold">&lt;aside&gt;</text>
  <text x="555" y="255" text-anchor="middle" font-size="12" fill="#6f42c1">Side info</text>
  <text x="555" y="273" text-anchor="middle" font-size="12" fill="#6f42c1">Links</text>
  <text x="555" y="291" text-anchor="middle" font-size="12" fill="#6f42c1">Related</text>

  <!-- footer -->
  <rect x="90" y="348" width="540" height="32" rx="4" fill="#6c757d" opacity="0.15" stroke="#6c757d" stroke-width="1.5"/>
  <text x="110" y="363" font-size="11" fill="#6c757d" font-weight="bold">&lt;footer&gt;</text>
  <text x="360" y="370" text-anchor="middle" font-size="12" fill="#6c757d">© 2025 My Site — All rights reserved</text>

  <!-- Legend -->
  <text x="360" y="408" text-anchor="middle" font-size="11" fill="#999">Each tag tells the browser (and search engines) what the content means</text>
</svg>
