<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="720" height="300" fill="#f8f9fa" rx="12"/>
  <text x="360" y="34" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Favicon — The Icon in the Browser Tab</text>

  <!-- Browser window -->
  <rect x="80" y="55" width="560" height="210" rx="10" fill="#fff" stroke="#ccc" stroke-width="1.5"/>

  <!-- Tab bar -->
  <rect x="80" y="55" width="560" height="38" rx="10" fill="#dee2e6"/>
  <rect x="80" y="79" width="560" height="14" fill="#dee2e6"/>

  <!-- Active tab (with favicon) -->
  <rect x="88" y="58" width="190" height="30" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <!-- Favicon icon inside tab -->
  <rect x="98" y="66" width="16" height="16" rx="3" fill="#e34c26"/>
  <text x="106" y="78" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">K</text>
  <text x="170" y="78" font-size="11" fill="#333">Kelsi | Frontend Dev</text>

  <!-- Inactive tab -->
  <rect x="284" y="61" width="160" height="26" rx="5" fill="#dee2e6" stroke="#bbb" stroke-width="1"/>
  <rect x="292" y="68" width="14" height="14" rx="2" fill="#264de4"/>
  <text x="300" y="79" text-anchor="middle" font-size="9" fill="#fff">G</text>
  <text x="356" y="79" font-size="11" fill="#777">Google</text>

  <!-- Another inactive tab -->
  <rect x="450" y="61" width="140" height="26" rx="5" fill="#dee2e6" stroke="#bbb" stroke-width="1"/>
  <rect x="458" y="68" width="14" height="14" rx="2" fill="#1da1f2"/>
  <text x="466" y="79" text-anchor="middle" font-size="9" fill="#fff">𝕏</text>
  <text x="510" y="79" font-size="11" fill="#777">Twitter / X</text>

  <!-- Address bar -->
  <rect x="140" y="97" width="440" height="20" rx="10" fill="#f1f3f4" stroke="#ddd" stroke-width="1"/>
  <text x="360" y="111" text-anchor="middle" font-size="11" fill="#888">mysite.com/index.html</text>

  <!-- Page content -->
  <text x="360" y="160" text-anchor="middle" font-size="14" fill="#aaa">Page content...</text>

  <!-- Annotation -->
  <line x1="106" y1="90" x2="106" y2="230" stroke="#e34c26" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="60" y="230" width="200" height="22" rx="4" fill="#fff4f0" stroke="#e34c26" stroke-width="1"/>
  <text x="160" y="245" text-anchor="middle" font-size="11" fill="#e34c26">← This is the favicon (16×16px icon)</text>

  <text x="360" y="285" text-anchor="middle" font-size="11" fill="#888">Add &lt;link rel="icon" href="favicon.png"&gt; inside your &lt;head&gt;</text>
</svg>
